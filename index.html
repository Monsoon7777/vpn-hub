<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ VPN HUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #07070d;
            --bg-2: #0d0d18;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== Фон: плавающие glow-пятна (чистый CSS, легко для батареи) ===== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            will-change: transform;
        }
        .orb-1 {
            width: 480px; height: 480px;
            top: -120px; left: -120px;
            background: radial-gradient(circle, #22c55e 0%, transparent 70%);
            animation: drift1 24s ease-in-out infinite;
        }
        .orb-2 {
            width: 420px; height: 420px;
            bottom: -100px; right: -100px;
            background: radial-gradient(circle, #38bdf8 0%, transparent 70%);
            animation: drift2 28s ease-in-out infinite;
        }
        .orb-3 {
            width: 360px; height: 360px;
            top: 40%; left: 50%;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            opacity: 0.25;
            animation: drift3 32s ease-in-out infinite;
        }
        @keyframes drift1 {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift2 {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-90px, -50px) scale(1.2); }
        }
        @keyframes drift3 {
            0%, 100% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, 40px) scale(0.9); }
        }
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
        }
        @media (max-width: 768px) {
            .orb { filter: blur(60px); opacity: 0.3; }
            .orb-1 { width: 300px; height: 300px; }
            .orb-2 { width: 280px; height: 280px; }
            .orb-3 { width: 240px; height: 240px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .orb { animation: none; }
        }

        /* ===== Layout ===== */
        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 24px 20px 60px;
            display: none;
        }
        .app.active { display: block; }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
        }

        /* ===== Шапка ===== */
        header.topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            animation: dropIn 0.6s cubic-bezier(0.22,1,0.36,1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-mark {
            width: 46px; height: 46px;
            display: grid; place-items: center;
            border-radius: 14px;
            font-size: 1.5rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 24px rgba(34,197,94,0.25);
        }
        .brand-text h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }
        .brand-text span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-pill b {
            color: var(--text);
            font-weight: 800;
        }
        .stat-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .icon-btn {
            width: 42px; height: 42px;
            display: grid; place-items: center;
            border-radius: 12px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            transition: border-color 0.25s, transform 0.25s;
        }
        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.25);
        }

        /* ===== Сетка карточек VPN ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }
        .vcard {
            position: relative;
            padding: 24px;
            border-radius: 22px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), border-color 0.35s, box-shadow 0.35s;
            animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) backwards;
        }
        .vcard:nth-child(1) { animation-delay: 0.05s; }
        .vcard:nth-child(2) { animation-delay: 0.1s; }
        .vcard:nth-child(3) { animation-delay: 0.15s; }
        .vcard:nth-child(4) { animation-delay: 0.2s; }
        .vcard:nth-child(5) { animation-delay: 0.25s; }
        .vcard:hover {
            transform: translateY(-5px);
            border-color: var(--card-accent);
            box-shadow: 0 18px 40px rgba(0,0,0,0.5), 0 0 30px var(--card-glow);
        }
        .vcard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--card-accent);
            opacity: 0.8;
        }
        .vcard::after {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: var(--card-glow);
            filter: blur(50px);
            opacity: 0.5;
            pointer-events: none;
        }
        .vcard-icon {
            font-size: 2.6rem;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 16px var(--card-glow));
            display: inline-block;
        }
        /* Стеклянный контейнер для логотипа */
        .logo-box {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 22px var(--card-glow), inset 0 0 12px rgba(255,255,255,0.04);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .vcard:hover .logo-box {
            transform: scale(1.06);
            box-shadow: 0 0 30px var(--card-glow), inset 0 0 14px rgba(255,255,255,0.06);
        }
        .logo-img {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }
        .modal-logo-box {
            width: 72px;
            height: 72px;
            margin-bottom: 0;
            flex: 0 0 72px;
        }
        .modal-logo-img {
            width: 56px !important;
            height: 56px !important;
            object-fit: cover !important;
            border-radius: 14px !important;
        }
        .logo-fallback {
            font-size: 2.4rem;
            filter: drop-shadow(0 0 10px var(--card-glow));
        }
        .vcard-name {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .vcard-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .vcard-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            background: var(--card-glow);
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vcard-expiry {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 5px 9px;
            border-radius: 8px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.35px;
            text-transform: uppercase;
        }
        .expiry-panel {
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(239,68,68,0.08));
            border: 1px solid rgba(239,68,68,0.28);
            margin-bottom: 22px;
        }
        .expiry-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #fca5a5;
            margin-bottom: 10px;
        }
        .expiry-timer {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }
        .expiry-unit {
            min-width: 0;
            padding: 10px 6px;
            border-radius: 12px;
            background: rgba(0,0,0,0.28);
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }
        .expiry-value {
            display: block;
            font-size: 1.25rem;
            font-weight: 900;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .expiry-unit-label {
            display: block;
            margin-top: 4px;
            font-size: 0.62rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        @media (max-width: 420px) {
            .expiry-timer { grid-template-columns: repeat(2, 1fr); }
        }
        .vcard-arrow {
            position: absolute;
            bottom: 22px; right: 22px;
            font-size: 1.2rem;
            opacity: 0.5;
            transition: transform 0.3s, opacity 0.3s;
        }
        .vcard:hover .vcard-arrow {
            transform: translateX(4px);
            opacity: 1;
        }

        /* ===== FAQ ===== */
        .faq-section {
            margin-top: 44px;
        }
        .section-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .faq-item {
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            margin-bottom: 10px;
        }
        .faq-q {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .faq-q:hover { background: rgba(255,255,255,0.03); }
        .faq-q .chev {
            transition: transform 0.3s;
            opacity: 0.6;
        }
        .faq-item.open .faq-q .chev { transform: rotate(180deg); }
        .faq-a {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .faq-item.open .faq-a {
            max-height: 300px;
        }
        .faq-a-inner {
            padding: 0 20px 18px;
        }


        .proxy-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .proxy-updated {
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .proxy-refresh {
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 700;
        }
        .proxy-ping {
            color: var(--text-muted);
            font-size: 0.74rem;
            margin-top: 3px;
        }
        .proxy-status .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .proxy-status .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        /* ===== Модалка ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 12, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            width: 100%;
            max-width: 560px;
            max-height: 86vh;
            overflow-y: auto;
            background: rgba(15, 17, 28, 0.92);
            border: 1px solid var(--modal-accent, var(--glass-border));
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px var(--modal-glow, transparent);
            position: relative;
            animation: modalPop 0.4s cubic-bezier(0.22,1.2,0.36,1);
        }
        .modal::-webkit-scrollbar { width: 8px; }
        .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .modal-close {
            position: absolute;
            top: 18px; right: 18px;
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            display: grid; place-items: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.12); }
        .modal-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            padding-right: 40px;
        }
        .modal-icon {
            font-size: 2.4rem;
            filter: drop-shadow(0 0 14px var(--modal-glow));
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .modal-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .block {
            margin-bottom: 22px;
        }
        .block-title {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--modal-accent);
            box-shadow: 0 0 18px var(--modal-glow);
        }
        .btn:active { transform: translateY(0) scale(0.97); }
        .btn.primary {
            background: var(--modal-accent);
            color: #07070d;
            border-color: var(--modal-accent);
            font-weight: 800;
        }
        .btn.full { flex: 1; justify-content: center; }

        .steps {
            list-style: none;
            counter-reset: step;
        }
        .steps li {
            position: relative;
            padding-left: 36px;
            margin-bottom: 14px;
            font-size: 0.92rem;
            line-height: 1.5;
            counter-increment: step;
        }
        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0; top: -1px;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--modal-accent);
            color: #07070d;
            display: grid; place-items: center;
            font-size: 0.78rem;
            font-weight: 900;
        }
        .note {
            background: rgba(0,0,0,0.35);
            border: 1px dashed var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.84rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .sub-box {
            background: rgba(0,0,0,0.45);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.76rem;
            color: #cbd5e1;
            word-break: break-all;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        /* ===== Серверные плитки ===== */
        .servers-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .servers-title {
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .protocol-pill {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--modal-glow, rgba(255,255,255,0.1));
            color: var(--modal-accent, #fff);
            border: 1px solid var(--modal-accent, transparent);
            letter-spacing: 0.3px;
        }
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        @media (max-width: 520px) {
            .servers-grid { grid-template-columns: 1fr; }
        }
        .server-tile {
            position: relative;
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            cursor: default;
            transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), border-color 0.35s, box-shadow 0.35s;
            animation: tileRise 0.5s cubic-bezier(0.22,1,0.36,1) backwards;
        }
        .server-tile:nth-child(1) { animation-delay: 0.05s; }
        .server-tile:nth-child(2) { animation-delay: 0.13s; }
        .server-tile:nth-child(3) { animation-delay: 0.21s; }
        .server-tile:nth-child(4) { animation-delay: 0.29s; }
        @keyframes tileRise {
            from { opacity: 0; transform: translateY(24px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .server-tile:hover {
            transform: translateY(-4px);
            border-color: var(--modal-accent);
            box-shadow: 0 14px 32px rgba(0,0,0,0.5), 0 0 26px var(--modal-glow);
        }
        /* Рекомендуемые серверы — свечение */
        .server-tile.featured {
            border-color: var(--modal-accent);
            background: linear-gradient(135deg, rgba(255,255,255,0.05), var(--modal-glow-soft, rgba(255,255,255,0.02)));
            box-shadow: 0 0 24px var(--modal-glow);
        }
        .server-tile.featured::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: var(--modal-glow);
            filter: blur(45px);
            opacity: 0.6;
            pointer-events: none;
        }
        /* ===== Живые флаги — ткань без древков ===== */
        .server-flag {
            position: relative;
            width: 132px;
            height: 82px;
            margin: 0 0 14px 0;
            display: block;
            perspective: 700px;
            filter: drop-shadow(0 10px 16px rgba(0,0,0,0.42));
            overflow: visible;
        }
        .flag-cloth {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: left center;
            transform: rotateY(-8deg) rotateZ(-1deg);
            animation: flagWave 3.2s ease-in-out infinite;
            transform-style: preserve-3d;
            border-radius: 3px 9px 9px 3px;
            overflow: hidden;
        }
        .flag-cloth svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        .flag-cloth::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(105deg,
                    rgba(255,255,255,0.28) 0%,
                    rgba(255,255,255,0.05) 17%,
                    transparent 34%,

                    btn.innerHTML = '✅ Готово';

                ta.value = text;

                try { document.execCommand('copy'); showToast('✅ Скопировано!'); }

        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
            }
            return bytes;
        }

        async function decryptHubData(pass, payload) {
            const enc = new TextEncoder();
            const salt = hexToBytes(payload.salt);
            const iv = hexToBytes(payload.iv);
            const tag = hexToBytes(payload.authTag);
            const cipher = hexToBytes(payload.ciphertext);

            const baseKey = await window.crypto.subtle.importKey(
                'raw',
                enc.encode(pass),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );

            const aesKey = await window.crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );

            const combined = new Uint8Array(cipher.byteLength + tag.byteLength);
            combined.set(cipher, 0);
            combined.set(tag, cipher.byteLength);

            const decrypted = await window.crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                aesKey,
                combined
            );

            const dec = new TextDecoder();
            return JSON.parse(dec.decode(decrypted));
        }

        // ===== Вход / Авторизация =====
        async function handleAuth(e) {
            e.preventDefault();
            const input = document.getElementById('authInput');
            const errBox = document.getElementById('authError');
            const btn = document.getElementById('authBtn');
            const val = input.value;
            if (!val) { errBox.textContent = 'Введите пароль'; return; }
            btn.disabled = true;
            btn.innerHTML = '<span class="auth-loading"></span>';
            errBox.textContent = '';
            try {
                const data = await decryptHubData(val, ENCRYPTED_PAYLOAD);
                if (!data) throw new Error('Неверный пароль');
                HUB_DATA = data;
                sessionStorage.setItem('vpn_hub_cache', JSON.stringify(data));
                input.value = '';
                showApp();
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Войти';
                input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
                errBox.textContent = '❌ Неверный пароль';
                input.value = ''; input.focus();
            }
        }

        function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('app').classList.add('active');
            renderDashboard();
        }

        async function logout() {
            sessionStorage.removeItem('vpn_hub_cache');
            HUB_DATA = null;
            location.reload();
        }


        function renderDashboard() {
            const { stats, services, faq } = HUB_DATA;
            document.getElementById('vpnCount').textContent = stats.vpnCount;
            document.getElementById('proxyCount').textContent = stats.proxyCount;

            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            services.forEach(s => {
                const card = document.createElement('div');
                card.className = 'vcard';
                card.style.setProperty('--card-accent', s.accent);
                card.style.setProperty('--card-glow', s.glow);
                const iconHtml = s.logo
                    ? `<div class="logo-box">
                         <img src="${s.logo}" class="logo-img" alt="${s.name}" onerror="this.parentElement.innerHTML='<span class=\\'logo-fallback\\'>${s.icon}</span>'">
                       </div>`
                    : `<div class="vcard-icon">${s.icon}</div>`;
                card.innerHTML = `
                    ${iconHtml}
                    <div class="vcard-name">${s.name}</div>
                    <div class="vcard-desc">${s.desc}</div>
                    <span class="vcard-tag">${s.tag}</span>
                    ${s.expiryAt ? `<div class="vcard-expiry">⚠️ Скоро закончится · <span data-card-timer="${s.id}">14д</span></div>` : ''}
                    <div class="vcard-arrow">→</div>
                `;
                card.addEventListener('click', () => openModal(s));
                grid.appendChild(card);
                if (s.expiryAt) {
                    startExpiryTimer(s);
                }
            });

            // FAQ
            const faqSec = document.getElementById('faqSection');
            faqSec.innerHTML = '<div class="section-title">❓ Частые вопросы</div>';
            faq.forEach((f, i) => {
                const item = document.createElement('div');
                item.className = 'faq-item';
                item.innerHTML = `
                    <div class="faq-q">
                        <span>${f.q}</span>
                        <span class="chev">▾</span>
                    </div>
                    <div class="faq-a"><div class="faq-a-inner">${f.a}</div></div>
                `;
                item.querySelector('.faq-q').addEventListener('click', () => {
                    item.classList.toggle('open');
                });
                faqSec.appendChild(item);
            });
        }

        // ===== Флаги: чистая ткань, без древков =====
        function makeFlag(country, fallback) {
            const c = String(country || '').toLowerCase();
            const colors = {
                'германия': ['#111827', '#dc2626', '#facc15'],
                'нидерланды': ['#dc2626', '#ffffff', '#2563eb'],
                'польша': ['#ffffff', '#dc2626'],
                'австрия': ['#dc2626', '#ffffff', '#dc2626'],
                'финляндия': ['#ffffff', '#2563eb', '#ffffff'],
            };

            if (c.includes('сша') || c.includes('соединённые штаты') || c.includes('соединенные штаты')) {
                let stripes = '';
                for (let i = 0; i < 13; i++) {
                    stripes += `<rect y="${i * 6.15}" width="132" height="6.15" fill="${i % 2 === 0 ? '#ef4444' : '#fff'}"/>`;
                }
                let stars = '';
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 6; col++) {
                        stars += `<circle cx="${7 + col * 9}" cy="${8 + row * 8}" r="1.05" fill="#fff"/>`;
                    }
                }
                return `<div class="flag-cloth"><svg viewBox="0 0 132 82" aria-hidden="true">
                    ${stripes}<rect width="57" height="43" fill="#1e3a8a"/>${stars}
                </svg></div>`;
            }

            const flagKey = Object.keys(colors).find(key => c.includes(key));
            if (flagKey) {
                const arr = colors[flagKey];
                const h = 82 / arr.length;
                return `<div class="flag-cloth"><svg viewBox="0 0 132 82" aria-hidden="true">
                    ${arr.map((color, i) => `<rect y="${(i*h).toFixed(2)}" width="132" height="${h.toFixed(2)}" fill="${color}"/>`).join('')}
                </svg></div>`;
            }

            // Для служебных карточек оставляем красивый живой глобус вместо эмодзи.
            if (c.includes('авто')) {
                return `<div class="flag-cloth"><svg viewBox="0 0 132 82" aria-hidden="true">
                    <defs><linearGradient id="globeG" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
                    <rect width="132" height="82" rx="4" fill="url(#globeG)"/>
                    <circle cx="66" cy="41" r="25" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
                    <path d="M41 41h50M66 16c8 8 12 16 12 25s-4 17-12 25M66 16c-8 8-12 16-12 25s4 17 12 25M47 26c11 5 27 5 38 0M47 56c11-5 27-5 38 0" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.5"/>
                </svg></div>`;
            }

            return `<div class="flag-cloth"><svg viewBox="0 0 132 82" aria-hidden="true">
                <rect width="132" height="82" rx="4" fill="#334155"/>
                <text x="66" y="51" text-anchor="middle" font-size="34">${fallback || '🌐'}</text>
            </svg></div>`;
        }

        // ===== Таймер окончания подписки =====
        function formatCountdown(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const days = Math.floor(total / 86400);
            const hours = Math.floor((total % 86400) / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const seconds = total % 60;
            return {
                days: String(days).padStart(2, '0'),
                hours: String(hours).padStart(2, '0'),
                minutes: String(minutes).padStart(2, '0'),
                seconds: String(seconds).padStart(2, '0')
            };
        }

        function startExpiryTimer(s) {
            if (!s.expiryAt) return;

            const update = () => {
                const left = new Date(s.expiryAt).getTime() - Date.now();
                const data = formatCountdown(left);

                const cardTimer = document.querySelector(`[data-card-timer="${s.id}"]`);
                if (cardTimer) {
                    cardTimer.textContent = left > 0
                        ? `${data.days}д ${data.hours}ч ${data.minutes}м`
                        : 'истёк';
                }

                const modalTimer = document.querySelector(`[data-modal-timer="${s.id}"]`);
                if (modalTimer) {
                    modalTimer.querySelector('[data-unit="days"]').textContent = data.days;
                    modalTimer.querySelector('[data-unit="hours"]').textContent = data.hours;
                    modalTimer.querySelector('[data-unit="minutes"]').textContent = data.minutes;
                    modalTimer.querySelector('[data-unit="seconds"]').textContent = data.seconds;
                    const label = modalTimer.querySelector('.expiry-label');
                    if (label) label.textContent = left > 0 ? '⚠️ Подписка скоро закончится' : '❌ Подписка закончилась';
                }
            };

            update();
            clearInterval(s._expiryTimer);
            s._expiryTimer = setInterval(update, 1000);
        }

        function makeExpiryPanel(s) {
            return `
                <div class="expiry-panel" data-modal-timer="${s.id}">
                    <div class="expiry-label">⚠️ Подписка скоро закончится</div>
                    <div class="expiry-timer">
                        <div class="expiry-unit"><span class="expiry-value" data-unit="days">00</span><span class="expiry-unit-label">дней</span></div>
                        <div class="expiry-unit"><span class="expiry-value" data-unit="hours">00</span><span class="expiry-unit-label">часов</span></div>
                        <div class="expiry-unit"><span class="expiry-value" data-unit="minutes">00</span><span class="expiry-unit-label">минут</span></div>
                        <div class="expiry-unit"><span class="expiry-value" data-unit="seconds">00</span><span class="expiry-unit-label">секунд</span></div>
                    </div>
                </div>
            `;
        }


        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
            }[ch]));
        }

        function renderProxyRows(list) {
            if (!Array.isArray(list) || !list.length) {
                return '<div class="note">Пока не найдено рабочих MTProto. Нажмите «Обновить» позже.</div>';
            }
            return list.map((p, i) => {
                const status = p.status === 'online' ? 'online' : (p.status === 'offline' ? 'offline' : 'checking');
                const statusText = status === 'online' ? 'онлайн' : (status === 'offline' ? 'офлайн' : 'проверка...');
                const ping = Number.isFinite(Number(p.ping)) ? `${Math.round(Number(p.ping))} ms` : '—';
                const url = escapeQuote(p.url || '');
                return `
                    <div class="proxy-row">
                        <div class="proxy-info">
                            <b>🔌 Прокси #${i + 1}</b>
                            <div class="proxy-host">${escapeHtml(p.server)}:${escapeHtml(p.port)}</div>
                            <div class="proxy-status">
                                <span class="status-dot ${status}" id="pstat-${i}"></span>
                                <span id="pstatxt-${i}">${statusText}</span>
                            </div>
                            <div class="proxy-ping" id="pping-${i}">Пинг: ${ping}</div>
                        </div>
                        <div class="proxy-actions">
                            <a href="${url}" class="btn primary">⚡ Подключить</a>
                            <button class="btn" onclick="copyText('${url}', this)">📋</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function refreshProxyData() {
            const grid = document.getElementById('proxyGrid');
            const updated = document.getElementById('proxyUpdated');
            const refreshBtn = document.getElementById('proxyRefresh');
            if (!grid) return;

            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ Обновляю...';
            }
            if (updated) updated.textContent = 'Получаю актуальные MTProto...';

            try {
                const updateRes = await fetch('/.netlify/functions/update-proxies', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                    body: '{}',
                    cache: 'no-store'
                });

                let updateJson = null;
                try { updateJson = await updateRes.json(); } catch (_) {}

                if (!updateRes.ok) {
                    throw new Error(updateJson?.error || `Обновление: HTTP ${updateRes.status}`);
                }

                const res = await fetch('/api/proxy-status', {
                    credentials: 'same-origin',
                    headers: authHeaders(),
                    cache: 'no-store'
                });
                const json = await res.json();
                if (!res.ok || !json.ok || !json.data) {
                    throw new Error(json.error || `Статус: HTTP ${res.status}`);
                }

                const list = Array.isArray(json.data.proxies) ? json.data.proxies : [];
                const proxyService = HUB_DATA?.services?.find(s => s.type === 'proxy');
                if (proxyService) proxyService.proxies = list;

                grid.innerHTML = renderProxyRows(list);
                if (updated) {
                    const t = json.data.checkedAt || json.data.updatedAt;
                    updated.textContent = t
                        ? `Найдено рабочих: ${list.length}. Проверено: ${new Date(t).toLocaleString('ru-RU')}`
                        : `Найдено рабочих: ${list.length}`;
                }

                if (HUB_DATA?.stats) {
                    HUB_DATA.stats.proxyCount = list.length;
                    const pill = document.getElementById('proxyCount');
                    if (pill) pill.textContent = list.length;
                }
            } catch (e) {
                if (updated) updated.textContent = 'Ошибка: ' + (e?.message || 'неизвестная ошибка');
            } finally {
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '↻ Обновить прокси';
                }
            }
        }

        function startProxyAutoRefresh() {
            clearInterval(window._proxyRefreshTimer);
            window._proxyRefreshTimer = setInterval(() => {
                if (document.getElementById('proxyGrid')) refreshProxyData();
            }, 5 * 60 * 1000);
        }

        // ===== Модалка =====
        function openModal(s) {
            const overlay = document.getElementById('modalOverlay');
            const modal = document.getElementById('modal');
            const body = document.getElementById('modalBody');

            modal.style.setProperty('--modal-accent', s.accent);
            modal.style.setProperty('--modal-glow', s.glow);

            const modalIconHtml = s.logo
                ? `<div class="logo-box modal-logo-box">
                     <img src="${s.logo}" class="logo-img modal-logo-img" alt="${s.name}" onerror="this.parentElement.innerHTML='<span class=\\'logo-fallback\\' style=\\'font-size:2.6rem\\'>${s.icon}</span>'">
                   </div>`
                : `<div class="modal-icon">${s.icon}</div>`;

            let content = `
                <div class="modal-head">
                    ${modalIconHtml}
                    <div>
                        <div class="modal-title">${s.name}</div>
                        <div class="modal-sub">${s.desc}</div>
                    </div>
                </div>
            `;

            if (s.type === 'client') {
                // Клиент: скачивание + инструкция
                content += `
                    <div class="block">
                        <div class="block-title">Скачать приложение</div>
                        <div class="btn-row">
                            ${s.links.map(l => `<a href="${l.url}" target="_blank" class="btn">${l.label}</a>`).join('')}
                        </div>
                    </div>
                    <div class="block">
                        <div class="block-title">Инструкция — ${s.steps.length} шага</div>
                        <ol class="steps">
                            ${s.steps.map(st => `<li>${st}</li>`).join('')}
                        </ol>
                        ${s.note ? `<div class="note">💡 ${s.note}</div>` : ''}
                    </div>
                `;
            } else if (s.type === 'subscription') {
                // Подписка
                if (s.expiryAt) {
                    content += makeExpiryPanel(s);
                }
                content += `
                    <div class="block">
                        <div class="block-title">Ссылка подписки</div>
                        ${s.pending
                            ? `<div class="sub-box">Ссылка будет добавлена после получения доступа.</div>`
                            : `<div class="sub-box">${s.url}</div>
                               <div class="btn-row">
                                   <button class="btn full" onclick="copyText('${escapeQuote(s.url)}', this)">📋 Скопировать</button>
                               </div>`
                        }
                    </div>
                    ${s.imports && s.imports.length ? `
                    <div class="block">
                        <div class="block-title">Авто-импорт в приложение</div>
                        <div class="btn-row">
                            ${s.imports.map(im => `<a href="${im.url}" class="btn primary">⚡ ${im.label}</a>`).join('')}
                        </div>
                    </div>` : ''}
                `;

                // Рекомендуемые серверы
                if (s.servers) {
                    const modalAccent = s.accent;
                    const modalGlow = s.glow;
                    // Мягкий вариант glow-цвета для градиента
                    const softGlow = modalGlow.replace(/0\.\d+\)/, '0.06)');
                    content += `
                    <div class="block">
                        <div class="servers-head">
                            <div class="servers-title">🌍 Рекомендуемые серверы</div>
                            ${s.servers.protocol ? `<span class="protocol-pill">${s.servers.protocol}</span>` : ''}
                        </div>
                        <div class="servers-grid" style="--modal-glow-soft: ${softGlow};">
                            ${s.servers.items.map(sv => `
                                <div class="server-tile ${sv.featured ? 'featured' : ''}" style="--modal-glow-soft: ${softGlow};">
                                    <div class="server-flag">${makeFlag(sv.country, sv.flag)}</div>
                                    <div class="server-country">${sv.country}</div>
                                    <div class="server-city">${sv.city}</div>
                                    ${sv.badge ? `<span class="server-badge badge-${sv.badge.type}">${badgeIcon(sv.badge.type)} ${sv.badge.text}</span>` : ''}
                                    <div class="server-desc">${sv.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                        ${s.servers.tip ? `<div class="servers-tip">💡 <b>Совет:</b> ${s.servers.tip}</div>` : ''}
                    </div>
                    `;
                }

                content += `${s.note ? `<div class="note">💡 ${s.note}</div>` : ''}`;
            } else if (s.type === 'proxy') {
                // Динамические MTProto-прокси загружаются только после авторизации.
                const list = Array.isArray(s.proxies) ? s.proxies : [];
                content += `
                    <div class="block">
                        <div class="proxy-toolbar">
                            <div>
                                <div class="block-title" style="margin-bottom:4px;">Telegram-прокси</div>
                                <div class="proxy-updated" id="proxyUpdated">загрузка актуального списка...</div>
                            </div>
                            <button class="proxy-refresh" id="proxyRefresh">↻ Обновить</button>
                        </div>
                        <div class="proxy-grid" id="proxyGrid">
                            ${renderProxyRows(list)}
                        </div>
                    </div>
                    <div class="note">💡 Пинг проверяется сервером по TCP-доступности MTProto. Автоматическая перепроверка выполняется примерно раз в 5 минут, пока окно прокси открыто.</div>
                `;
            }

            body.innerHTML = content;
            overlay.classList.add('show');

            if (s.expiryAt) {
                startExpiryTimer(s);
            }

            // Серверная проверка всех актуальных MTProto.
            if (s.type === 'proxy') {
                refreshProxyData();
                const refreshBtn = document.getElementById('proxyRefresh');
                if (refreshBtn) refreshBtn.addEventListener('click', refreshProxyData);
                startProxyAutoRefresh();
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function escapeQuote(str) {
            return String(str).replace(/'/g, "\\'");
        }

        // Иконки для бейджей серверов
        function badgeIcon(type) {
            const icons = {
                star: '⭐',
                ai: '🤖',
                games: '🎮',
                reserve: '🔄',
                whitelist: '💙',
                auto: '↔️'
            };
            return icons[type] || '';
        }

        // ===== Проверка статуса прокси (HTTP, с оговорками) =====
        function checkProxyStatus(host, index) {
            const dot = document.getElementById(`pstat-${index}`);
            const txt = document.getElementById(`pstatxt-${index}`);
            if (!dot || !txt) return;

            const done = (status) => {
                if (status === 'online') {
                    dot.className = 'status-dot online';
                    txt.textContent = 'онлайн';
                } else {
                    dot.className = 'status-dot offline';
                    txt.textContent = 'офлайн / недоступен для проверки';
                }
            };

            const img = new Image();
            let finished = false;
            const finish = (st) => { if (!finished) { finished = true; done(st); } };

            img.onload = () => finish('online');
            img.onerror = () => finish('online'); // сервер ответил — значит жив
            setTimeout(() => finish('offline'), 4500);

            try {
                img.src = `https://${host}/favicon.ico?_=${Date.now()}`;
            } catch (e) {
                finish('offline');
            }
        }

        // ===== Инициализация =====
        document.getElementById('authForm').addEventListener('submit', handleAuth);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('faqBtn').addEventListener('click', () => {
            document.getElementById('faqSection').scrollIntoView({ behavior: 'smooth' });
        });
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        // Инициализация Telegram Mini App.
        telegramReady();

        // Восстановление HttpOnly-сессии или показ формы входа.
        
        // Проверка сохраненной сессии
        (function() {
            try {
                const cached = sessionStorage.getItem('vpn_hub_cache');
                if (cached) {
                    HUB_DATA = JSON.parse(cached);
                    showApp();
                    return;
                }
            } catch (_) {}
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('app').classList.remove('active');
        })();
    </script>
</body>
